<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4F4A" />
      <stop offset="100%" stop-color="#146B64" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07856" />
      <stop offset="100%" stop-color="#F28E6D" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B4F4A" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background soft cream circle -->
  <rect width="512" height="512" rx="128" fill="#FFF1CC" />
  
  <!-- Outer Protective Shield -->
  <g filter="url(#softGlow)">
    <path d="M256 64 C350 64, 400 90, 420 120 C420 280, 340 390, 256 448 C172 390, 92 280, 92 120 C112 90, 162 64, 256 64 Z" 
          fill="url(#shieldGrad)" />
  </g>

  <!-- Inner Soft Golden Ring / Shield Core -->
  <path d="M256 100 C326 100, 364 122, 380 144 C380 268, 318 358, 256 406 C194 358, 132 268, 132 144 C148 122, 186 100, 256 100 Z" 
        fill="#FFFFFF" opacity="0.12" />

  <!-- Warm Family Heart & Pause Bars Symbol -->
  <!-- Left Family Figure / Protective Arc -->
  <path d="M210 180 C210 160, 230 145, 256 145 C282 145, 302 160, 302 180" 
        stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" fill="none" />
  <circle cx="256" cy="182" r="22" fill="url(#accentGrad)" />

  <!-- Protective Pause Pill / Shield Heart in Terracotta -->
  <rect x="206" y="240" width="34" height="96" rx="17" fill="#FFFFFF" />
  <rect x="272" y="240" width="34" height="96" rx="17" fill="#FFFFFF" />
  
  <!-- Calming Accent Dot -->
  <circle cx="256" cy="370" r="14" fill="url(#accentGrad)" />
</svg>
